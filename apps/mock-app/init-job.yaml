apiVersion: batch/v1
kind: Job
metadata:
  name: mock-app-init
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: nginx:1.27
          command: ["sh", "-c", "echo init start; sleep 5; echo init failed; exit 1"]
